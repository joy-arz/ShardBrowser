# Fast checks on every push / PR: `cargo test` for the Rust backend on all
# three target OSes (so the Windows-only DPAPI / OSCrypt code actually runs),
# plus a TypeScript typecheck for the frontend.
#
# This does NOT bundle the app — no WiX/NSIS, no WebView2 fetch. The release
# pipeline (release.yml) is the one that produces installers + the portable zip.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win-x64
          - os: macos-14
            label: mac-arm64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    name: cargo test (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.label }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-test-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      # `cargo test` runs build.rs -> tauri_build::build(), which wants the
      # frontendDist dir to exist. We don't build the real UI here, so stub it.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p dist && printf '<!doctype html><title>stub</title>' > dist/index.html

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture

  frontend-typecheck:
    runs-on: ubuntu-22.04
    name: tsc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-kit/package-lock.json
      - run: npm ci
      - run: npm run build
